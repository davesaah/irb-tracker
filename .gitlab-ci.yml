stages:
  - security
  - test
  - build
  - scan
  - deploy

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  CI_REGISTRY: "gitlab.davesaah-pc.com:5050" 
  IMAGE_NAME: "$CI_REGISTRY/davesaah/irb-tracker"

# -------------------------
# SECURITY
# -------------------------

gosec:
  stage: security
  image: golang:1.26
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec ./...

govulncheck:
  stage: security
  image: golang:1.26
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source .

# -------------------------
# TEST
# -------------------------

test:
  stage: test

  image: golang:1.26

  services:
    - name: mysql:9.7
      alias: mysql

  variables:
    # for go application
    DBHOST: mysql
    DBPORT: "3306"
    DBUSER: app
    DBPASS: app
    DBNAME: app_test

    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: app_test
    MYSQL_USER: app
    MYSQL_PASSWORD: app
    DB_HOST: mysql
    DB_PORT: 3306

  script:
    - go test ./...

# -------------------------
# BUILD
# -------------------------

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false", "--insecure-registry=gitlab.davesaah-pc.com:5050"]
  variables:
    # These are required for Docker-in-Docker to work
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY

  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG

# -------------------------
# SCAN
# -------------------------

trivy:
  stage: scan
  variables:
    TRIVY_INSECURE: "true"
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE_NAME:$IMAGE_TAG

# -------------------------
# DEPLOY
# -------------------------

deploy:
  stage: deploy
  only:
    - main

  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client

  script:
    - |
      ssh deploy@server "
        cd /srv/myapp &&
        TAG=$CI_COMMIT_SHORT_SHA docker compose pull &&
        TAG=$CI_COMMIT_SHORT_SHA docker compose up -d
      "
